name: 🐛 Bug 报告 (Bug Report)
description: 提交文档中的错误描述、失效的示例代码或不符合 DSH 0.2.0-rc.2 的陈旧内容
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供清晰的复现步骤与官方证据支持。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 哪篇文档存在问题？具体现象是什么？
      placeholder: 例如：references/services.md 中关于 ctx.xxx 挂载名与官方源码不符...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 官方代码或文档证据
      description: 请贴出 DSH 0.2.0-rc.2 源码包中对应的文件路径或 TypeScript 类型定义片段
      placeholder: 例如：@deepseek-ai/dsh-schedule/lib/types/index.d.ts 第 12 行...
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 修复建议（可选）
      description: 你认为应该如何修改？
