name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Documentation Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check for dead markdown links and orphan references
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            function walk(dir) {
              let res = [];
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                if (e.name === "node_modules" || e.name === ".git") continue;
                const f = path.join(dir, e.name);
                if (e.isDirectory()) res.push(...walk(f));
                else if (e.name.endsWith(".md")) res.push(f);
              }
              return res;
            }
            const files = walk(".");
            const linkRe = /\[([^\]]+)\]\(([^)]+)\)/g;
            let errors = 0;
            const linked = new Set();
            for (const file of files) {
              const text = fs.readFileSync(file, "utf8");
              let m;
              while ((m = linkRe.exec(text)) !== null) {
                const url = m[2];
                if (url.startsWith("http") || url.startsWith("#") || url.startsWith("mailto") || url.includes("<") || url.includes(">")) continue;
                const clean = url.split("#")[0];
                if (!clean) continue;
                const p = path.resolve(path.dirname(file), clean);
                if (!fs.existsSync(p)) {
                  console.error(`Dead link in ${file}: ${url}`);
                  errors++;
                } else if (path.basename(p).endsWith(".md")) {
                  linked.add(path.basename(p));
                }
              }
            }
            // 孤儿文档：每篇 references/*.md 至少被别处链接一次
            const refDir = path.join(".", "references");
            if (fs.existsSync(refDir)) {
              for (const name of fs.readdirSync(refDir)) {
                if (!name.endsWith(".md")) continue;
                if (name === "README.md") continue;
                if (!linked.has(name)) {
                  console.error(`Orphan reference (never linked): references/${name}`);
                  errors++;
                }
              }
            }
            if (errors > 0) process.exit(1);
            console.log("Docs check passed: 0 dead links, 0 orphans across " + files.length + " files.");
          '
      - name: Check entry documents for hardcoded version tokens
        run: |
          node -e '
            const fs = require("fs");
            const entryFiles = ["SKILL.md", "README.md", "references/README.md"];
            let errors = 0;
            const versionRe = /\b(?:v?\d+\.\d+\.\d+(-rc\.\d+)?)\b/;
            for (const file of entryFiles) {
              if (!fs.existsSync(file)) continue;
              const lines = fs.readFileSync(file, "utf8").split("\n");
              let inCodeFence = false;
              for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (line.trim().startsWith("```")) {
                  inCodeFence = !inCodeFence;
                  continue;
                }
                if (inCodeFence) continue;
                if (versionRe.test(line)) {
                  console.error(`Hardcoded version token in ${file}:${i + 1}: ${line.trim()}`);
                  errors++;
                }
              }
            }
            if (errors > 0) {
              console.error(`Found ${errors} hardcoded version tokens in entry documents. Use <version> or keep version history exclusive to CHANGELOG.md.`);
              process.exit(1);
            }
            console.log("Version token check passed: entry documents are strictly version-agnostic.");
          '
