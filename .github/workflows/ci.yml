name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Scaffolder & Integrity
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test plugin scaffolder & validator (Positive & Negative contract suite)
        run: |
          node scripts/test_validator.mjs

      - name: Check for dead markdown links
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            function walk(dir) {
              let res = [];
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                if (e.name === "node_modules" || e.name === ".git") continue;
                const f = path.join(dir, e.name);
                if (e.isDirectory()) res.push(...walk(f));
                else if (e.name.endsWith(".md")) res.push(f);
              }
              return res;
            }
            const files = walk(".");
            const regex = /\[([^\]]+)\]\(([^)]+)\)/g;
            let errors = 0;
            for (const file of files) {
              const text = fs.readFileSync(file, "utf8");
              let m;
              while ((m = regex.exec(text)) !== null) {
                const url = m[2];
                if (url.startsWith("http") || url.startsWith("#") || url.startsWith("mailto")) continue;
                const clean = url.split("#")[0];
                if (!clean) continue;
                const p = path.resolve(path.dirname(file), clean);
                if (!fs.existsSync(p)) {
                  console.error(`Dead link in ${file}: ${url} -> ${p}`);
                  errors++;
                }
              }
            }
            if (errors > 0) process.exit(1);
            console.log("Dead link check passed: 0 dead links found across " + files.length + " files.");
          '
