# dsh-weather-plugin 补丁配置
- insert:
    - id: weather-plugin
      name: dsh-weather-plugin
      config:
        apiKey: "demo-key-12345"
        units: "celsius"
        refreshInterval: 600
        apiEndpoint: !!js 'process.env.CUSTOM_API_ENDPOINT || "https://api.weather.example.com"'
      disabled: false
