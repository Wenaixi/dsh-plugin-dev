# dsh-configurable-plugin — 带配置校验与动态环境变量的演示层
- insert:
    - id: configurable-plugin
      name: dsh-configurable-plugin
      config:
        apiEndpoint: !!js 'process.env.CUSTOM_API_ENDPOINT || "https://custom-api.example.com/v1"'
        timeoutMs: 10000
        enableRetry: true
        advanced:
          maxConcurrentRequests: 8
          debugHeaders: true
